services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.98
    command: server -s3 -dir=/data -volume.max=0
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data

  data-registry:
    image: icy-seas-data-registry:dev
    build:
      context: apps/data-registry
    environment:
      REGISTRY_DATABASE_URL: postgresql+psycopg://registry:registry@postgres:5432/registry
      REGISTRY_ADMIN_API_KEY: ${REGISTRY_ADMIN_API_KEY:-development-only-change-me}
      REGISTRY_TOKEN_PEPPER: ${REGISTRY_TOKEN_PEPPER:-development-only-change-me-too}
      REGISTRY_S3_INTERNAL_ENDPOINT_URL: http://seaweedfs:8333
      REGISTRY_S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:8333
      REGISTRY_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-development}
      REGISTRY_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-development}
      REGISTRY_HASH_ALGORITHM: ${REGISTRY_HASH_ALGORITHM:-sha256}
    ports:
      - "${REGISTRY_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  ingest-worker:
    image: icy-seas-data-registry:dev
    command: ["python", "-m", "data_registry.worker"]
    environment:
      REGISTRY_DATABASE_URL: postgresql+psycopg://registry:registry@postgres:5432/registry
      REGISTRY_TOKEN_PEPPER: ${REGISTRY_TOKEN_PEPPER:-development-only-change-me-too}
      REGISTRY_S3_INTERNAL_ENDPOINT_URL: http://seaweedfs:8333
      REGISTRY_S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:8333
      REGISTRY_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-development}
      REGISTRY_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-development}
      REGISTRY_HASH_ALGORITHM: ${REGISTRY_HASH_ALGORITHM:-sha256}
    depends_on:
      data-registry:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
