name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/courier-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/courier-desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  windows-installer:
    name: Windows installer smoke test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/courier-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/courier-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-installer
      - run: npm ci
      - run: npm run check
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Install and launch the NSIS bundle
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/test-windows-installer.ps1" `
            -BundleDirectory "$env:GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/release/bundle/nsis" `
            -InstallDirectory "$env:RUNNER_TEMP/Courier installer smoke test"

  registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-registry
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
