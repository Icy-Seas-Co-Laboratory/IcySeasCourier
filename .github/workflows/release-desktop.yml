name: Release Courier Desktop

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: courier-desktop-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Match the tag and application versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/courier-desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/courier-desktop/src-tauri/tauri.conf.json').version")"
          workspace_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          expected_tag="courier-v${package_version}"

          test "$package_version" = "$tauri_version"
          test "$package_version" = "$workspace_version"
          release_tag="${{ github.event.release.tag_name }}"
          if [ "$release_tag" != "$expected_tag" ]; then
            echo "Release tag must be ${expected_tag}; received ${release_tag}." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg
          - label: Windows x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
          - label: Linux x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/courier-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        working-directory: apps/courier-desktop
        run: npm ci

      - name: Import Developer ID certificate and notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is not configured}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is not configured}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is not configured}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is not configured}"
          : "${APPLE_API_PRIVATE_KEY:?APPLE_API_PRIVATE_KEY is not configured}"

          certificate_path="$RUNNER_TEMP/courier-developer-id.p12"
          keychain_path="$RUNNER_TEMP/courier-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$signing_identity" ]; then
            echo "The certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "COURIER_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and attach macOS release artifact
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: apps/courier-desktop
          releaseId: ${{ github.event.release.id }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease }}
          args: ${{ matrix.tauri_args }}

      - name: Build and attach release artifact
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/courier-desktop
          releaseId: ${{ github.event.release.id }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease }}
          args: ${{ matrix.tauri_args }}

      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${COURIER_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$COURIER_SIGNING_KEYCHAIN" || true
          fi
