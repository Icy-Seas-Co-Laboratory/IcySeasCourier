[workspace]
members = [
  "apps/courier-cli",
  "apps/courier-desktop/src-tauri",
  "crates/courier-core",
  "crates/courier-pack",
  "crates/courier-registry",
  "crates/courier-transfer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
aws-config = "1.8"
aws-sdk-s3 = "1.137"
aws-smithy-runtime-api = "1.9"
aws-smithy-types = "1.3"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
keyring = { version = "3.6.3", default-features = false }
rand = "0.9"
futures-util = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"
