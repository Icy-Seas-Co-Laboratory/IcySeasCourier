[package]
name = "courier-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "courier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
courier-core = { path = "../../../crates/courier-core" }
courier-pack = { path = "../../../crates/courier-pack" }
courier-registry = { path = "../../../crates/courier-registry" }
courier-transfer = { path = "../../../crates/courier-transfer" }
chrono.workspace = true
filetime = "0.2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
