[project]
name = "icy-seas-data-registry"
version = "0.1.0"
description = "Control plane for reliable Icy Seas scientific dataset ingestion"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "boto3==1.43.69",
  "blake3==1.0.8",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.1",
  "xxhash==3.6.0",
  "zstandard==0.25.0"
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema[format]==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
