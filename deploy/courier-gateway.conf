map $http_x_forwarded_proto $courier_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

map $http_x_forwarded_for $courier_vpn_client {
    default $http_x_forwarded_for;
    "" 100.64.0.1;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://data-registry:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $courier_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 300s;
    }
}

# Headscale does not currently provision certificates for Tailscale Serve.
# This listener is published on host loopback only and may only be targeted by
# Headscale Serve over the encrypted tailnet. Registry still sees a secure hop.
server {
    listen 8081;
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://data-registry:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $courier_vpn_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 300s;
    }
}
